      - name: rec_sub_name
        title: 预算科目名称（收入归属）
        description: 归一化拼接，仅展示
        sql: rec_sub_name_canon
        type: string

      # ── 缴收分侧其余成员 ──
      - name: funds_nature_code
        title: 资金性质编码（缴款票面）
        sql: "{CUBE}.`ffundsnaturecode`"
        type: string
      - name: funds_nature_name
        title: 资金性质名称（缴款票面）
        sql: "{CUBE}.`ffundsnaturename`"
        type: string
      - name: rec_funds_nature_code
        title: 资金性质编码（收入归属）
        sql: "{CUBE}.`frecfundsnaturecode`"
        type: string
      - name: rec_funds_nature_name
        title: 资金性质名称（收入归属）
        sql: "{CUBE}.`frecfundsnaturename`"
        type: string
      - name: rec_bgt_agen_code
        title: 收入方预算归类编码
        description: 收入侧预算单位以 fiscal_income_daybook_view 的 bgt_agen_name 为
          权威；本列宽表回填当前全空，仅备查
        sql: "{CUBE}.`frecbgtagencode`"
        type: string
      - name: rec_bgt_agen_name
        title: 收入方预算归类名称
        description: 收入侧预算单位以 fiscal_income_daybook_view 的 bgt_agen_name 为
          权威；本列宽表回填当前全空，仅备查
        sql: "{CUBE}.`frecbgtagenname`"
        type: string

      # ── 无名称实体（只 code，不造名字）──
      - name: rec_agency_code
        title: 收入单位编码
        description: frecagenidcode——名称列缺口，待 ETL 补
        sql: "{CUBE}.`frecagenidcode`"
        type: string
      - name: chgfin_dept_id
        title: 归口业务处室ID
        description: fchgfindeptid——高填充；fdeptid/fbusinessorgcode 实测全 0 不建
        sql: "{CUBE}.`fchgfindeptid`"
        type: string

      # ── 普通维度 ──
      - name: bus_type
        title: 业务类型
        description: fbustype（直缴/汇缴）
        sql: "{CUBE}.`fbustype`"
        type: string
      - name: income_sort_code
        title: 收入类别编码
        sql: "{CUBE}.`fincomesortcode`"
        type: string
      - name: income_sort_name
        title: 收入类别名称
        sql: "{CUBE}.`fincomesortname`"
        type: string

      # ── 代理银行：生产口径=代收银行（PayBook.java:67 注释，字典 152）──
      - name: pay_bank_code
        title: 代理银行编码
        description: fpaybankcode——生产口径"代理银行"（代收非税收入的银行，字典 152，
          现成统计 fne_yhsjtj_zjxz 即按它分组）；TopN 排名/分组用本成员
        sql: "{CUBE}.`fpaybankcode`"
        type: string
      - name: pay_bank_name
        title: 代理银行名称
        description: fpaybankname——字典翻译在抽取侧完成（fne_paybook_new.sql:57），原值展示
        sql: "{CUBE}.`fpaybankname`"
        type: string
      - name: rec_acct_name
        title: 收款账户名称
        sql: "{CUBE}.`frecacctname`"
        type: string
      - name: rec_acct_type
        title: 收款账户类型
        description: frecaccttype 字典 136：0虚拟/1财政专户/2汇缴专户/3待解缴/4单位监管/5国库/7单位清分/9其他
        sql: "{CUBE}.`frecaccttype`"
        type: string
      - name: bgt_style
        title: 资金管理方式（缴款行回填）
        description: fbgtstyle——资金管理方式的清分归属以 fiscal_allocation_view 的
          bgt_style 为权威（清分表全覆盖，值域 1国库/2专户/4其他）；本列为缴款行
          回填，未清分行空，仅备查
        sql: "{CUBE}.`fbgtstyle`"
        type: string
      - name: calc_source
        title: 分解来源
        description: fcalcsource：1不分成 2分成 3提留 4余额——是否分成 = ≠'1'，分成比例无数据列
        sql: "{CUBE}.`fcalcsource`"
        type: string
      - name: pay_channel
        title: 缴款渠道
        sql: "{CUBE}.`fpaychannel`"
        type: string
      - name: state
        title: 缴款书状态
        description: fstate：1未缴款(正常待缴) 2作废 3已缴款未到账 4已到账（代码字典
          BillStateConsts；CK 现状仅见 ''/'1'/'2'/'3'）；"未缴缴款书"判定
          走 fiscal_paybook_unpaid_view（une_paybook_high 主表反连宽表；
          宽表 fstate='1' 仅 1 行不代表未缴池）；本表主表为 FNE 缴款书（缴款后生成），分档
          天然不含填制未缴；"完成缴款"勿用 state（3≠完成），用 is_received=1
        sql: "{CUBE}.`fstate`"
        type: string
      - name: is_received
        title: 是否到账（缴款）
        description: fisreceived——财政端缴款到账标志（0未到账 1已到账，Nullable(UInt32)
          数值型比较不加引号）；"完成的缴款"判定=is_received=1；
          到账日期轴 received_date，同 is_received='1' 子集口径
        sql: "{CUBE}.`fisreceived`"
        type: number

      # ── 分档维度：单笔缴款金额按十倍区间切桶 ──
      - name: amount_bucket
        title: 金额档位（单笔缴款）
        description: ftotalamt（缴款书总额=单笔金额，非明细行 famt）切桶——
          十倍区间：<1千/1千–1万/1万–10万/10万–100万/≥100万，中段左闭右开（1000
          归 1千–1万 档、10000 归 1万–10万 档，依此类推）；同票各行同值（fan trap），分桶
          计数必须配 paybook_count（countDistinct fpaycode），禁 count（行数重复计）；
          实测 ftotalamt 无 NULL，
          isNull 兜底 '未知' 档防 NULL 落尾档；分档口径=今年缴款 pay_date 落当年+排除作废
          state!='2'；已缴判定注记——本表主表为 FNE 缴款书（缴款后
          生成，未缴书不入宽表），分档天然不含填制未缴，无需另加判定；paybook_count 数的是
          缴款动作非票据张数（一个 fpaycode 可跨多张明细缴款书，汇总缴款陷阱）
        sql: "multiIf(isNull({CUBE}.`ftotalamt`), '未知', {CUBE}.`ftotalamt` < 1000, '<1千', {CUBE}.`ftotalamt` < 10000, '1千–1万', {CUBE}.`ftotalamt` < 100000, '1万–10万', {CUBE}.`ftotalamt` < 1000000, '10万–100万', '≥100万')"
        type: string
      - name: pay_code
        title: 缴款码
        description: fpaycode——票据流 join 桥
        sql: "{CUBE}.`fpaycode`"
        type: string
      - name: units
        title: 计量单位
        sql: "{CUBE}.`funits`"
        type: string

      # ── 时间维度（全 String → toDateOrNull；time_shift 同期对比靠 pay_date）──
      - name: pay_date
        title: 缴款日期
        description: fdate——缴款口径主时间轴（缴款/收入统计默认轴，同环比族钉它）；
          跨日缴款勿用 ffilldate。注：fpaytime 是纯时分秒'10:15:12'形态、无日期部分，
          与 fdate 无派生关系
        sql: "toDateOrNull({CUBE}.`fdate`)"
        type: time
      - name: received_date
        title: 资金到账日期
        description: freceiveddate——前端"收入日期"即绑它；与 enter_date 口径不同勿混用。
          ffundsrecdate（资金对账/缴款到账日期）与 freceiveddate 同义近轴不双建
        sql: "toDateOrNull({CUBE}.`freceiveddate`)"
        type: time
      - name: enter_date
        title: 划拨到账日期（报文侧）
        description: fenterdate——划拨到账日期（源 FNE_TRANSFER_BANK_MSG 银行划拨报文，
          清分资金到账日）。查询为空属预期，ETL 补数后自动生效；
          "到账"现用 received_date（资金到账日期）。treasury 视图同名 enter_date 是
          入库日期、allocation 视图同名是二次划转到账日期——三视图同名三种节点勿混查
        sql: "toDateOrNull({CUBE}.`fenterdate`)"
        type: time

      # ── 资金链节点 ──
      - name: treasury_enter_date
        title: 缴库入库日期（缴款书口径，取最晚）
        description: fne_treasury_transfer_new.fenterdate 按 fpaycode 聚合 MAX（主 sql x6 层带入，
          一笔缴款可拆多笔缴库取最晚）——全程耗时终点（国库回执入库日）。⚠ 与本表
          enter_date（划转 MSG 到账）、treasury 视图 enter_date（缴库单粒度）同名不同物勿混；
          未缴库行落 NULL（join miss，Nullable 列 CK 默认值即 NULL）；该表 fpaycode
          当前未装载，join 命中 0 属数据现实，ETL 补装载后自动生效
        sql: treasury_enter_date
        type: time
      - name: duration_bucket
        title: 缴库耗时档位
        description: 全程耗时=缴库入库日期−缴款日期（天），全程耗时分档维度，时长序列
          <1天/1–10天/10–100天/≥100天；未缴库（终点空，NULL∨1970 双哨兵判定）落"未缴库"档，
          分档笔数用 paybook_count（fpaycode 去重）
        sql: "multiIf(treasury_enter_date IS NULL OR treasury_enter_date = toDate('1970-01-01'), '未缴库', dateDiff('day', toDateOrNull({CUBE}.`fdate`), treasury_enter_date) < 1, '<1天', dateDiff('day', toDateOrNull({CUBE}.`fdate`), treasury_enter_date) < 10, '1–10天', dateDiff('day', toDateOrNull({CUBE}.`fdate`), treasury_enter_date) < 100, '10–100天', '≥100天')"
        type: string
      - name: trans_date
        title: 划转回执日期
        description: ftransdate——银行回执成功时写入（RestTransferService.java:279），语义≈划转
          执行/回执日；"下达"（fstats 0→1）无独立日期字段，滞留起算锚以此为最接近可用字段
          （近似待人定）。实测仅 2 行非空——"今年下达"过滤会清空在途池
        sql: "toDateOrNull({CUBE}.`ftransdate`)"
        type: time
      - name: transit_bucket
        title: 在途滞留时长档位
        description: 当前日−划转回执日期（天），在途滞留分档维度，时长序列；回执日空落"未知"
          档（存量池实测绝大多数行落此桶）；配 transiting_amt/transiting_bill_count 使用
        sql: "multiIf(toDateOrNull({CUBE}.`ftransdate`) IS NULL, '未知', dateDiff('day', toDateOrNull({CUBE}.`ftransdate`), today()) < 1, '<1天', dateDiff('day', toDateOrNull({CUBE}.`ftransdate`), today()) < 10, '1–10天', dateDiff('day', toDateOrNull({CUBE}.`ftransdate`), today()) < 100, '10–100天', '≥100天')"
        type: string
      - name: fill_date
        title: 开具日期（填开）
        description: ffilldate——票面开具/填开日期；跨日缴款时 ≠ pay_date。精度仅到日，
          "超24小时"按"开具日期早于今天"近似（昨日深夜开票不足24h会被计入）
        sql: "toDateOrNull({CUBE}.`ffilldate`)"
        type: time
      - name: reconcile_date
        title: 对账日期（缴款书）
        description: freconciledate——缴款书对账日期（缴款记录对账）；与 ffundsrecdate
          （资金对账/缴款到账日期）是两笔对账，本表只建
          记录对账轴。与 received_date（资金到账）两口径勿混用——实测有已对账未到账、
          也有已到账未对账行，对账与到账无严格先后；treasury 视图同名是缴库对账口径
        sql: "toDateOrNull({CUBE}.`freconciledate`)"
        type: time

      # ── 不建清单：
      #    ffundsrecdate（资金对账日期，与 freceiveddate 同覆盖）；fcleartime（清分时间，不作维度）；
      #    ftrnasreconciledate（到账对账日期基本无值，entered_amt 三条件判定备查，不当维度）；
      #    ftransdate_last/fenterdate_last/fisenter_last/ftransno_last（_last 历史对照列，取数辨析
      #    同 syn_transfer.ktr rename 回填，现口径用当期列）；
      #    ftransdate 已建 trans_date（存量池注记见该成员）；
      #    fstats（实库无此列——仅 ftransstats 落划转 4 表且整列空，池条件落地退化见
      #    transiting_amt）；
      #    fconfirmdate（与 pay_date 基本同日、个别行反而早于缴款日，无独立轴价值）；
      #    fpaytime（纯时分秒'10:15:12'形态，与 fdate 无派生关系，完整缴款时刻需
      #    fdate+fpaytime 拼合，暂无场景不建）

      # ── 敏感字段（建维度 + mask 脱敏）──
      - name: payer_name
        title: 缴款人名称
        description: fpayername——已解除脱敏（TopN 排名/明细可出缴款人）；
          fpayerno/fpayerid 账号敏感仍不建维度
        sql: "{CUBE}.`fpayername`"
        type: string

      # ── 技术键（可建但 public: false）──
      - name: fpid
        title: 缴款书ID
        sql: "{CUBE}.`fpid`"
        type: string
        public: false
      - name: fid
        title: 明细行ID
        sql: "{CUBE}.`fid`"
        type: string
        public: false
      - name: paybook_sub_id
        title: 缴款书明细ID
        sql: "{CUBE}.`fpaybooksubid`"
        type: string
        public: false
      - name: data_tag
        title: 数据标签
        description: fdatatag 实测全空
        sql: "{CUBE}.`fdatatag`"
        type: string
        public: false

    # 行级权限：三条款骨架（group/conditions/row_level），白名单制
    # （未命中任何策略=整表拒绝 1=0）。
    # collection 差异点：① 财政用户区划过滤落 rec_rgn_code（收入归属区划=财政口径），不是执收区划；
    # ② payer_name 脱敏已解除（fpayerno/fpayerid 账号类仍不建维度）；
    # ③ rec_rgn_code 空值行丢行属已知行为。
    access_policy:
      # ① 财政用户：JWT 带 region_code → 收入归属区划=本区划
      - group: "*"
        conditions:
          - if: "{ securityContext.region_code }"
        row_level:
          filters:
            - member: rec_rgn_code
              operator: equals
              values: [ "{ securityContext.region_code }" ]
      # ② 单位用户：JWT 带 agency_code → 执收单位=本单位（场景 13）
      - group: "*"
        conditions:
          - if: "{ securityContext.agency_code }"
        row_level:
          filters:
            - member: chg_agency_code
              operator: equals
              values: [ "{ securityContext.agency_code }" ]
      # ③ 平台/管理用户：region、agency 均无 → 全量放行（两条 conditions AND）
      - group: "*"
        conditions:
          - if: "{ not securityContext.region_code }"
          - if: "{ not securityContext.agency_code }"
        row_level:
          allow_all: true
    pre_aggregations:
      - name: main
        measures:
          - fiscal_collection.count
          - fiscal_collection.amt
        dimensions:
          - fiscal_collection.state
        timeDimension: fiscal_collection.pay_date
        granularity: month
        # CK 23.3.15 强制：预聚合必须带 indexes（MergeTree ORDER BY 即主键），
        # 缺失报 UserError "doesn't support pre-aggregations without indexes"
        indexes:
          - name: main_idx
            columns:
              - fiscal_collection.state
              - fiscal_collection.pay_date.month
