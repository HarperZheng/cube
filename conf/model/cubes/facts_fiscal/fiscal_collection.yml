# 财政缴款全景事实（fne_paybook_full_high）
# 缴收分侧：无前缀=缴款票面、rec_*=收入归属；码名对：code 分组 + name 展示
# 口径：到账金额按 freceiveddate 衍生（fisenter='1' 实测不可用）；ftotalamt 禁 sum（fan trap）
# ⚠️ CK 23.3.15 限制：派生表同层 2 个及以上子查询 LEFT JOIN 时，
#    外层查询无法解析星号展开列（UNKNOWN_IDENTIFIER）；归一化分 5 层嵌套、每层仅 1 个 join。
cubes:
  - name: fiscal_collection
    title: 财政缴款全景
    description: |
      缴款全景事实 fne_paybook_full_high，明细粒度缴款书×项目行。
      覆盖缴款+代收+收入归属+划拨状态(_last)。
      消费方统一从 fiscal_collection_view 查；cube 层只留原料。
    public: true

    sql: |
      SELECT * FROM (
        SELECT * FROM (
          SELECT * FROM (
            SELECT * FROM (
              SELECT * FROM (
                SELECT * FROM (
                  SELECT t.*, c.chg_agency_name_canon FROM fne_paybook_full_high t
              LEFT JOIN (SELECT fchgagencode,
                                arrayStringConcat(arraySort(groupUniqArray(fchgagenname)), ' / ') AS chg_agency_name_canon
                         FROM fne_paybook_full_high GROUP BY fchgagencode) c ON t.fchgagencode = c.fchgagencode
            ) x1
            LEFT JOIN (SELECT frecrgncode,
                              arrayStringConcat(arraySort(groupUniqArray(frecrgnname)), ' / ') AS rec_rgn_name_canon
                       FROM fne_paybook_full_high WHERE frecrgncode != '' GROUP BY frecrgncode) r ON x1.frecrgncode = r.frecrgncode
          ) x2
          LEFT JOIN (SELECT fitemcode,
                            arrayStringConcat(arraySort(groupUniqArray(fitemname)), ' / ') AS item_name_canon
                     FROM fne_paybook_full_high WHERE fitemcode != '' GROUP BY fitemcode) i ON x2.fitemcode = i.fitemcode
        ) x3
        LEFT JOIN (SELECT fsubcode,
                          arrayStringConcat(arraySort(groupUniqArray(fsubname)), ' / ') AS sub_name_canon
                   FROM fne_paybook_full_high WHERE fsubcode != '' GROUP BY fsubcode) s ON x3.fsubcode = s.fsubcode
      ) x4
      LEFT JOIN (SELECT frecsubcode,
                        arrayStringConcat(arraySort(groupUniqArray(frecsubname)), ' / ') AS rec_sub_name_canon
                 FROM fne_paybook_full_high WHERE frecsubcode != '' GROUP BY frecsubcode) rs ON x4.frecsubcode = rs.frecsubcode
      # ── x5：每书头行标记（头表口径金额）——宽表含字节级重复行（部分书的
      #    min(fid) 头行物理重复），sumIf 限首行仍会重复计值；
      #    h 内层先取每书 min(fid) 再自 join (fpaycode,fid) 行数得头行物理行数 book_head_rows，
      #    paybook_amt 以 sum(ftotalamt/book_head_rows) 限头行 → 每书恰计一次（头行全同值，
      #    任何查询过滤下重复行 all-or-nothing，归一化严格成立）──
      ) x5
      LEFT JOIN (
        SELECT b.fpaycode, b.mf AS book_head_fid, fc.cnt AS book_head_rows
        FROM (SELECT fpaycode, min(fid) AS mf FROM fne_paybook_full_high GROUP BY fpaycode) b
        INNER JOIN (SELECT fpaycode, fid, count() AS cnt FROM fne_paybook_full_high GROUP BY fpaycode, fid) fc
          ON b.fpaycode = fc.fpaycode AND b.mf = fc.fid
      ) h ON x5.fpaycode = h.fpaycode
      # ── x6：缴库入库日期（全程耗时终点）+ 已入库标记——fne_treasury_transfer_new
      #    按 fpaycode 聚合取 MAX(fenterdate)（一笔缴款可拆多笔缴库）与 max(fenterstatus='1')
      #    已入库标记；⚠ 该表 fpaycode 当前未装载（join 命中 0，全落"未缴库"档
      #    属数据现实），ETL 补装载后自动生效 ──
      ) x6
      LEFT JOIN (SELECT fpaycode, max(toDateOrNull(fenterdate)) AS treasury_enter_date,
                        max(if(fenterstatus = '1', 1, 0)) AS treasury_entered_flag
                 FROM fne_treasury_transfer_new GROUP BY fpaycode) tb ON x6.fpaycode = tb.fpaycode

    measures:
      - name: count
        title: 缴款明细行数
        drill_members: [ pay_date, chg_agency_name, rec_sub_name, item_name, payer_name ]
        type: count
      - name: paybook_count
        title: 缴款书笔数
        description: countDistinct(fpaycode)——一票多项目行，count 是行数勿当笔数
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
      - name: amt
        title: 缴款金额(元)
        description: famt 合计——缴款明细口径
        drill_members: [ pay_date, chg_agency_name, item_name ]
        sql: "{CUBE}.`famt`"
        type: sum
      - name: entered_amt
        title: 到账金额(元)
        description: sum(fimamt) WHERE freceiveddate 非空（fisenter 判定实测不可用，
          按到账回执列单条件判定）；完整判定=三条件（fisenter+fenterdate+ftrnasreconciledate），
          未采用
        sql: "{CUBE}.`fimamt`"
        type: sum
        filters:
          - sql: "{CUBE}.`freceiveddate` != ''"
      # ── 同环比族 ──
      # 每原料三件套×3 周期：ly(1year)/lm(1month)/lq(1quarter) 伴生 + yoy/mom/qoq 的 diff/rate
      # 轴随族：amt/count → pay_date；entered_amt → received_date
      # 伴生=内部实现（timeShift 是成员级属性、sql 无内联平移语法，是 diff/rate 的编译依赖，勿单删），不进 view；diff/rate 必进
      # multiStage 现算不进预聚合（同 bill_count 惯例）
      # ⚠️ 季度平移写 3 months 勿写 1 quarter——cubestore(Arrow) 不解析 "1 quarter"
      #    （Arrow error: Invalid input syntax for type interval），季长恒 3 个月，quarter 分组下两者等价
      - name: amt_ly
        title: 缴款金额(元)·去年同期
        description: 内部伴生——amt 平移 1 年（钉 pay_date），amt_yoy_diff/amt_yoy_rate 的编译依赖，勿进 view includes
        sql: '{amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 1 year
            type: prior
            time_dimension: pay_date
      - name: amt_yoy_diff
        title: 缴款金额同比差值(元)
        description: 缴款金额同比差（与上年同期）——引擎已算，粒度随问句（年/季/月分组分别为年/季/月度同比）
        multiStage: true
        sql: '{amt} - {amt_ly}'
        type: number
      - name: amt_yoy_rate
        title: 缴款金额同比增长率(%)
        description: 缴款金额同比增长率=(本期−上年同期)÷上年同期×100——引擎已算；上年同期为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({amt} - {amt_ly}) / NULLIF({amt_ly}, 0)'
        type: number
      - name: amt_lm
        title: 缴款金额(元)·上月
        description: 内部伴生——amt 平移 1 月（钉 pay_date），amt_mom_diff/amt_mom_rate 的编译依赖，勿进 view includes
        sql: '{amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 1 month
            type: prior
            time_dimension: pay_date
      - name: amt_mom_diff
        title: 缴款金额月环比差值(元)
        description: 缴款金额月环比差（与上月）——引擎已算，粒度必须 month
        multiStage: true
        sql: '{amt} - {amt_lm}'
        type: number
      - name: amt_mom_rate
        title: 缴款金额月环比增长率(%)
        description: 缴款金额月环比增长率=(本期−上月)÷上月×100——引擎已算；上月为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({amt} - {amt_lm}) / NULLIF({amt_lm}, 0)'
        type: number
      - name: amt_lq
        title: 缴款金额(元)·上季
        description: 内部伴生——amt 平移 1 季（钉 pay_date），amt_qoq_diff/amt_qoq_rate 的编译依赖，勿进 view includes
        sql: '{amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 3 months
            type: prior
            time_dimension: pay_date
      - name: amt_qoq_diff
        title: 缴款金额季环比差值(元)
        description: 缴款金额季环比差（与上季）——引擎已算，粒度必须 quarter
        multiStage: true
        sql: '{amt} - {amt_lq}'
        type: number
      - name: amt_qoq_rate
        title: 缴款金额季环比增长率(%)
        description: 缴款金额季环比增长率=(本期−上季)÷上季×100——引擎已算；上季为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({amt} - {amt_lq}) / NULLIF({amt_lq}, 0)'
        type: number
      # count 族（pay_date 轴）——伴生 type 用 number（docs/12 示例形态，批 1 count_ly 同款实证）
      - name: count_ly
        title: 缴款明细行数·去年同期
        description: 内部伴生——count 平移 1 年（钉 pay_date），count_yoy_diff/count_yoy_rate 的编译依赖，勿进 view includes
        sql: '{count}'
        type: number
        multiStage: true
        timeShift:
          - interval: 1 year
            type: prior
            time_dimension: pay_date
      - name: count_yoy_diff
        title: 缴款明细行数同比差值
        description: 缴款明细行数同比差（与上年同期）——引擎已算，粒度随问句（年/季/月分组分别为年/季/月度同比）
        multiStage: true
        sql: '{count} - {count_ly}'
        type: number
      - name: count_yoy_rate
        title: 缴款明细行数同比增长率(%)
        description: 缴款明细行数同比增长率=(本期−上年同期)÷上年同期×100——引擎已算；上年同期为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({count} - {count_ly}) / NULLIF({count_ly}, 0)'
        type: number
      - name: count_lm
        title: 缴款明细行数·上月
        description: 内部伴生——count 平移 1 月（钉 pay_date），count_mom_diff/count_mom_rate 的编译依赖，勿进 view includes
        sql: '{count}'
        type: number
        multiStage: true
        timeShift:
          - interval: 1 month
            type: prior
            time_dimension: pay_date
      - name: count_mom_diff
        title: 缴款明细行数月环比差值
        description: 缴款明细行数月环比差（与上月）——引擎已算，粒度必须 month
        multiStage: true
        sql: '{count} - {count_lm}'
        type: number
      - name: count_mom_rate
        title: 缴款明细行数月环比增长率(%)
        description: 缴款明细行数月环比增长率=(本期−上月)÷上月×100——引擎已算；上月为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({count} - {count_lm}) / NULLIF({count_lm}, 0)'
        type: number
      - name: count_lq
        title: 缴款明细行数·上季
        description: 内部伴生——count 平移 1 季（钉 pay_date），count_qoq_diff/count_qoq_rate 的编译依赖，勿进 view includes
        sql: '{count}'
        type: number
        multiStage: true
        timeShift:
          - interval: 3 months
            type: prior
            time_dimension: pay_date
      - name: count_qoq_diff
        title: 缴款明细行数季环比差值
        description: 缴款明细行数季环比差（与上季）——引擎已算，粒度必须 quarter
        multiStage: true
        sql: '{count} - {count_lq}'
        type: number
      - name: count_qoq_rate
        title: 缴款明细行数季环比增长率(%)
        description: 缴款明细行数季环比增长率=(本期−上季)÷上季×100——引擎已算；上季为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({count} - {count_lq}) / NULLIF({count_lq}, 0)'
        type: number
      # entered_amt 族（received_date 轴，到账口径）
      - name: entered_amt_ly
        title: 到账金额(元)·去年同期
        description: 内部伴生——entered_amt 平移 1 年（钉 received_date），entered_amt_yoy_diff/entered_amt_yoy_rate 的编译依赖，勿进 view includes
        sql: '{entered_amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 1 year
            type: prior
            time_dimension: received_date
      - name: entered_amt_yoy_diff
        title: 到账金额同比差值(元)
        description: 到账金额同比差（与上年同期）——引擎已算，粒度随问句（年/季/月分组分别为年/季/月度同比）
        multiStage: true
        sql: '{entered_amt} - {entered_amt_ly}'
        type: number
      - name: entered_amt_yoy_rate
        title: 到账金额同比增长率(%)
        description: 到账金额同比增长率=(本期−上年同期)÷上年同期×100——引擎已算；上年同期为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({entered_amt} - {entered_amt_ly}) / NULLIF({entered_amt_ly}, 0)'
        type: number
      - name: entered_amt_lm
        title: 到账金额(元)·上月
        description: 内部伴生——entered_amt 平移 1 月（钉 received_date），entered_amt_mom_diff/entered_amt_mom_rate 的编译依赖，勿进 view includes
        sql: '{entered_amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 1 month
            type: prior
            time_dimension: received_date
      - name: entered_amt_mom_diff
        title: 到账金额月环比差值(元)
        description: 到账金额月环比差（与上月）——引擎已算，粒度必须 month
        multiStage: true
        sql: '{entered_amt} - {entered_amt_lm}'
        type: number
      - name: entered_amt_mom_rate
        title: 到账金额月环比增长率(%)
        description: 到账金额月环比增长率=(本期−上月)÷上月×100——引擎已算；上月为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({entered_amt} - {entered_amt_lm}) / NULLIF({entered_amt_lm}, 0)'
        type: number
      - name: entered_amt_lq
        title: 到账金额(元)·上季
        description: 内部伴生——entered_amt 平移 1 季（钉 received_date），entered_amt_qoq_diff/entered_amt_qoq_rate 的编译依赖，勿进 view includes
        sql: '{entered_amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 3 months
            type: prior
            time_dimension: received_date
      - name: entered_amt_qoq_diff
        title: 到账金额季环比差值(元)
        description: 到账金额季环比差（与上季）——引擎已算，粒度必须 quarter
        multiStage: true
        sql: '{entered_amt} - {entered_amt_lq}'
        type: number
      - name: entered_amt_qoq_rate
        title: 到账金额季环比增长率(%)
        description: 到账金额季环比增长率=(本期−上季)÷上季×100——引擎已算；上季为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({entered_amt} - {entered_amt_lq}) / NULLIF({entered_amt_lq}, 0)'
        type: number

      # ── 头表口径金额：缴款书总额 SUM(ftotalamt) 每书计一次 ──
      # 宽表含字节级重复行（部分书的 min(fid) 头行物理重复），
      # 直接 sumIf(fid=头fid) 会重复计值；本成员以 sum(ftotalamt/头行物理
      # 行数) 限头行归一化——每书恰计一次。book_head_fid/book_head_rows 由主 sql x5 层 join 带入
      - name: paybook_amt
        title: 缴款金额(元)（头表口径）
        description: sum 限每书头行并按头行物理行数归一化——缴款书总额口径（SUM(ftotalamt)，
          非明细行 famt）；与 amt（明细行合计）数值不等勿互混；月走势/代理银行
          排名类问题用本成员按 pay_date 分组、答案层自算环比
        sql: "{CUBE}.`ftotalamt` / book_head_rows"
        type: sum
        filters:
          - sql: "{CUBE}.`fid` = book_head_fid"

      # ── 全程耗时：缴款→缴库，终点=每书最晚缴库日（主 sql x6 层带入）──
      # ⚠ 断供现状：fne_treasury_transfer_new.fpaycode 未装载，join 命中 0，
      # 未缴库行 treasury_enter_date 落 NULL（Nullable 列 CK join miss 默认值即 NULL），
      # 查询全落"未缴库"档属数据现实，ETL 补装载后自动生效
      - name: entered_paybook_count
        title: 已缴库笔数
        description: countDistinct fpaycode 限已有缴库记录（treasury_enter_date 非空非 1970）——
          全程耗时分档合计的导出量核对基准；一笔缴款可拆多笔缴库，每书取最晚入库日
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "(treasury_enter_date IS NOT NULL AND treasury_enter_date != toDate('1970-01-01'))"

      # ── 在途滞留：指令已发未到账存量池（宽表列）──
      # 池条件落地退化：fstats 列实库无此列，不作过滤依据，7=失败
      # 由 fisenter='0' OR fenterdate 空兜底；"今年下达"同样不可执行
      # （池内 ftransdate 仅个别行非空）——本组为存量在途池口径，
      # 题面"今年"按 trans_date 过滤会清空在途池属数据现实
      - name: transiting_amt
        title: 在途滞留金额(元)
        description: sum(ftransamt) 限在途滞留池（fistransfer='1' 且 fisenter='0' 或入库日空）——
          在途滞留池口径（fstats 条件落地不可执行见上）；与 allocation 视图 pending_trans_amt
          （未划拨，互补池）勿混；池内 ftransamt per ftransno 实测常数，sum 无复印虚高
        sql: "{CUBE}.`ftransamt`"
        type: sum
        filters:
          - sql: "{CUBE}.`fistransfer` = '1' AND ({CUBE}.`fisenter` = '0' OR {CUBE}.`fenterdate` = '')"
      - name: transiting_bill_count
        title: 在途滞留笔数
        description: countDistinct ftransno 同池——宽表 ftransno=划转阶段单号（FTRANSFERNO），
          与 treasury 视图 ftransno（缴库单号，实库交集 0）同名不同物勿互连
        sql: "{CUBE}.`ftransno`"
        type: countDistinct
        filters:
          - sql: "{CUBE}.`fistransfer` = '1' AND ({CUBE}.`fisenter` = '0' OR {CUBE}.`fenterdate` = '')"

      # ── 异常/时效族（7 个过滤型度量，笔数键统一 fpaycode）──
      # fstats 全库无此列，相关池维持退化口径（见不建清单注记）
      - name: late_received_paybook_count
        title: 超期到账笔数
        description: countDistinct fpaycode 限已到账（is_received=1）且到账超 10 天
          （到账日−缴款日>10，到账日非空才参与）——"缴款后资金超过10天才到账"；
          起算缴款日 fdate，到账锚 received_date
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "{CUBE}.`fisreceived` = 1 AND {CUBE}.`freceiveddate` != '' AND dateDiff('day', toDateOrNull({CUBE}.`fdate`), toDateOrNull({CUBE}.`freceiveddate`)) > 10"
      - name: late_unreconciled_paybook_count
        title: 超期未对账笔数
        description: countDistinct fpaycode 限已到账且未完成资金对账（fisfundsrec=0 或
          ffundsrecdate 空）且到账后超 15 天（当前日−到账日>15）——"资金到账后超过15天
          仍未完成对账"；fisfundsrec 为 Nullable(UInt32) 数值型比较不加引号；
          勿用缴库批次数顶替
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "{CUBE}.`fisreceived` = 1 AND ({CUBE}.`fisfundsrec` = 0 OR {CUBE}.`ffundsrecdate` = '') AND {CUBE}.`freceiveddate` != '' AND dateDiff('day', toDateOrNull({CUBE}.`freceiveddate`), today()) > 15"
      - name: pay_before_fill_paybook_count
        title: 缴款早于开具笔数
        description: countDistinct fpaycode 限缴款日期早于开票日期（fdate<ffilldate，两列非空
          才参与比较）——异常存在性校验（代码仅兜底纠偏无校验，历史数据可能存在）
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "{CUBE}.`fdate` != '' AND {CUBE}.`ffilldate` != '' AND toDateOrNull({CUBE}.`fdate`) < toDateOrNull({CUBE}.`ffilldate`)"
      - name: no_income_paybook_count
        title: 未形成收入记录笔数
        description: countDistinct fpaycode 限已到账（is_received=1）且 fpaycode 在收入流水表
          无记录（NOT IN fne_income_daybook——NOT IN 形态双环境免疫，join_use_nulls 差异
          见 fiscal_paybook_unpaid 头注）——"已缴款但尚未形成收入记录"
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "{CUBE}.`fisreceived` = 1 AND {CUBE}.`fpaycode` NOT IN (SELECT fpaycode FROM fne_income_daybook)"
      - name: fund_mismatch_paybook_count
        title: 资金错配笔数（应缴国库实落专户）
        description: countDistinct fpaycode 限资金性质应缴国库（frecfundsnaturecode∈
          '11','12','13','14'，缴款侧 ffundsort 抽取改名落地列）且实落专户（fbgtstyle='2'）
          ——错配判定=跨字段组合条件，按接收侧性质分组的口径非本判定
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "{CUBE}.`frecfundsnaturecode` IN ('11','12','13','14') AND {CUBE}.`fbgtstyle` = '2'"
      - name: received_before_pay_paybook_count
        title: 到账早于缴款笔数
        description: countDistinct fpaycode 限到账日期早于缴款日期（freceiveddate<fdate，
          两列非空才参与比较）——异常存在性校验
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "{CUBE}.`freceiveddate` != '' AND {CUBE}.`fdate` != '' AND toDateOrNull({CUBE}.`freceiveddate`) < toDateOrNull({CUBE}.`fdate`)"
      # 已缴入国库未清分（fenterstatus='1'，x6 层 treasury_entered_flag 标记）但缴款书未完成
      # 清分（fcollectid 空=未汇总；关联键 fpaycode，清分表无 ftransno 勿直连）；⚠ treasury 表
      # fpaycode 当前未装载 join 命中 0（度量恒 0 属数据现实），ETL 补装载后自动生效
      - name: entered_not_cleared_paybook_count
        title: 已缴入国库未清分笔数
        description: countDistinct fpaycode 限已缴入国库（fenterstatus='1'，主 sql x6 层
          treasury_entered_flag）且未清分（fcollectid 空=未汇总中间态）——异常存在性校验
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
        filters:
          - sql: "treasury_entered_flag = 1 AND {CUBE}.`fcollectid` = ''"
      - name: not_cleared_im_amt
        title: 已缴入国库未清分金额(元)
        description: sum(fimamt) 同池——已缴入国库未清分的辅口径金额
        sql: "{CUBE}.`fimamt`"
        type: sum
        filters:
          - sql: "treasury_entered_flag = 1 AND {CUBE}.`fcollectid` = ''"

    dimensions:
