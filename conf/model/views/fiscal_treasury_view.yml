# 缴库入库交付视图—— 非税收入全景 P10（26-资金模块建模开发方案 §八）
# 消费方（BI/前端/REST）统一从 view 查；cube 层只留原料。
# 不建 folders：缴库入库无缴收分侧需求（单侧口径），成员约 20 个一屏可览——
# folder 是 UI 分组，无分侧不硬造；AI 区分口径主力 = ai_context + title。
views:
  - name: fiscal_treasury_view
    title: 缴库入库明细+汇总
    description: 缴库入库事实（ftm，去重后明细粒度缴库单×科目）；已入国库笔数/金额、按科目/区划汇总
    meta:
      ai_context: >-
        缴库入库视图，一行一笔缴库明细（缴库单×科目，已按明细去重）；缴库单数用 bill_count，明细笔数用 count。
        四层状态：缴库回执成功 status='9'；已入国库 enter_status='1'（"已缴入国库"判定，全局拍板2）；
        国库记账 income_status='1'（记账回写层，仅用于"未入库先记账"类异常校验，不作入库判定）；
        对账成功 reconcile_status='1'。
        "已入国库/已缴入国库"判定= enter_status='1'：金额用 amt，笔数用 count，时间轴必须用 enter_date（入国库日期）；
        缴库单量/日报趋势按 build_date（缴库单生成日期=建单日），两者口径不同勿混用。
        enter_date（入国库）与 allocation/collection 视图的 enter_date（划拨到账）同名不同义；
        reconcile_date（缴库对账）与 enter_date 完全同日勿当独立轴；
        reconcile_status 是缴库对账状态，与 allocation 视图的到账对账状态同名不同节点。
        金额：明细金额用 amt；total_amt 是整单金额复印在每明细行，禁 sum。
        分组用 sub_code；sub_name 是全部别名字典序拼接（一码多名脏数据），仅展示不作准。
        缴库单科目是清分归属口径，与 collection 视图的缴款票面科目（sub_*）不可混用。
        双侧区划：资金来源侧 chg_rgn_code、收入归属侧 rec_rgn_code，均无名称列只出编码。
        分成比例 share_rate 是位串编码（多段定长比例序列），仅供原样展示，人工解读口径二期再定。
        缴库数据暂无执收单位/缴款码维度（源列全空），按单位或缴款书查缴库暂不可行，单位用户查询为空属预期。
        同比/环比差值与增长率成员（amt/count 两度量的 _yoy_diff/_yoy_rate/_mom_diff/_mom_rate/_qoq_diff/_qoq_rate 全系）：与上年同期/上月/上季的差值或增长率，引擎已算，直接绑定，答案层勿重复计算；同比用 _yoy 系（平移量固定 1 年，粒度随问句——按年/季/月分组分别为年/季/月度同比），月环比用 _mom 系（month 分组），季环比用 _qoq 系（quarter 分组），问"环比"不带粒度默认月环比；_ly/_lm/_lq 伴生列为内部实现，勿直接查询；增长率=差值÷上年同期×100，上年同期为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0；时间轴随问句语义——缴库口径按 build_date，已入国库口径按 enter_date 并带 enter_status='1'；同环比查询单条只用一条时间轴；reconcile_date 无同环比语义。
    cubes:
      - join_path: fiscal_treasury
        includes:
          - count
          - bill_count
          - amt
          - total_amt
          - amt_yoy_diff
          - amt_yoy_rate
          - count_yoy_diff
          - count_yoy_rate
          - amt_mom_diff
          - amt_mom_rate
          - count_mom_diff
          - count_mom_rate
          - amt_qoq_diff
          - amt_qoq_rate
          - count_qoq_diff
          - count_qoq_rate
          - trans_no
          - sub_code
          - sub_name
          - sub_level
          - sub_level_name
          - status
          - enter_status
          - income_status
          - reconcile_status
          - share_rate
          - chg_rgn_code
          - rec_rgn_code
          - pay_acct_name
          - rec_acct_name
          - build_date
          - enter_date
          - reconcile_date
        excludes:
          - fid             # 技术键——view 不继承 public:false，显式挡
          - fpid
