# 未缴缴款书（une_paybook_high 反连宽表）
# 口径：未缴=生产左连判定（UPayBook.xml:1428-1431，UNE 有 FNE 无记录）+有效 fstate≠'2'；
#       未缴缴款书不入缴款宽表（主表 FNE_PAYBOOK），故主表取 une_paybook_high
# ⚠ CK join_use_nulls 双环境：直连 CK session 默认 0（miss 右列填类型默认值 String→空串），
#    cube 驱动 session 强制 1（miss 右列填 NULL）——反连判定写
#    f.fpaycode='' 在 cube 运行时全灭（0 行）、写 IS NULL 在直连全灭，均勿用；
#    落地用 NOT IN 子查询形态（两种 settings 下同数）
# ⚠ CK 别名遮蔽：SELECT 里 any(fstate) AS fstate 与源列同名时，同层 WHERE fstate 会被
#    解析成 SELECT 别名 → ILLEGAL_AGGREGATION——同层 WHERE 必须限定
#    表名（une_paybook_high.fstate）或输出别名换名
# 数据现状：une 无 ffilldate/frecmode 列——开具日时长锚用 fdate（issue_date 口径即此）；
#   feffdate/ftotalamt 全表无空值；
#   主 sql 内层 SELECT 携带全部维度列（内层少列会让对应维度 missing column）
cubes:
  - name: fiscal_paybook_unpaid
    title: 未缴缴款书
    description: |
      未缴缴款书池：une_paybook_high（缴款通知书，UNE 侧）按 fpaycode 聚合到缴款书级后
      反连缴款宽表取"无缴款记录"，池内已排除作废（fstate='2'）。未缴时长分档、催缴清单。
      消费方统一从 fiscal_paybook_unpaid_view 查。
    public: true

    sql: |
      SELECT * FROM (
        SELECT fpaycode, any(fdate) AS fdate, any(fstate) AS fstate,
               any(feffdate) AS feffdate, any(ftotalamt) AS ftotalamt,
               any(fitemcode) AS fitemcode, any(fitemname) AS fitemname,
               any(fpayername) AS fpayername, any(fbustype) AS fbustype,
               any(faccagencode) AS faccagencode, any(faccrgncode) AS faccrgncode
        FROM une_paybook_high
        WHERE une_paybook_high.fstate != '2'
        GROUP BY fpaycode
      ) u
      WHERE u.fpaycode NOT IN (SELECT DISTINCT fpaycode FROM fne_paybook_full_high)

    measures:
      - name: unpaid_paybook_count
        title: 未缴笔数
        description: countDistinct fpaycode——未缴缴款书笔数（笔数键统一 fpaycode）；
          分档合计应等于本计数
        sql: "{CUBE}.`fpaycode`"
        type: countDistinct
      - name: unpaid_paybook_amt
        title: 未缴票面金额(元)
        description: sum(ftotalamt)——未缴池票面金额合计（单笔票面=ftotalamt 口径，非明细
          famt）；池内一书一行无重复计费；une 全表该列无空值
        sql: "{CUBE}.`ftotalamt`"
        type: sum

    dimensions:
      - name: pay_code
        title: 缴款码
        description: fpaycode——缴款通知书业务键，未缴池主键（聚合粒度=一书一行）
        sql: "{CUBE}.`fpaycode`"
        type: string
      - name: issue_date
        title: 开具日期
        description: une_paybook_high.fdate——缴款通知书开具日（UPayBook.xml:1406，未缴
          时长起算锚）。⚠ 与缴款宽表 fdate（缴款日期）同列名不同义勿混；une 无 ffilldate
          列，开具日锚用本列
        sql: "toDateOrNull({CUBE}.`fdate`)"
        type: time
      - name: eff_date
        title: 有效期截止日期
        description: feffdate——缴款书有效期截止日（过期判定两处代码口径并存：严格比较
          OpenQueryAPIServiceImpl.java:615 与 <= EInvoiceToCloudErrorDataDao.xml:79，本池按
          当日仍有效=feffdate>=当前日）；une 全表该列无空值
        sql: "toDateOrNull({CUBE}.`feffdate`)"
        type: time
      - name: eff_state
        title: 有效期状态
        description: 三档衍生——有效=feffdate>=当前日、已过期=feffdate<当前日、未知=空；
          "仍有效未作废"=本字段='有效'（完整口径叠加 state='1'）；"已过期未缴"=本字段=
          '已过期' AND state='1'；勾稽关系：有效+已过期（同 state='1'）合计=未缴总数
        sql: "multiIf(toDateOrNull({CUBE}.`feffdate`) IS NULL, '未知', toDateOrNull({CUBE}.`feffdate`) >= today(), '有效', '已过期')"
        type: string
      - name: unpaid_bucket
        title: 未缴时长档位
        description: 当前日−开具日期（天），分档维度，时长序列 <1天/1–10天/
          10–100天/≥100天，开具日空落"未知"档；池以 ≥100天 档为主（存量历史票）
        sql: "multiIf(toDateOrNull({CUBE}.`fdate`) IS NULL, '未知', dateDiff('day', toDateOrNull({CUBE}.`fdate`), today()) < 1, '<1天', dateDiff('day', toDateOrNull({CUBE}.`fdate`), today()) < 10, '1–10天', dateDiff('day', toDateOrNull({CUBE}.`fdate`), today()) < 100, '10–100天', '≥100天')"
        type: string
      - name: state
        title: 缴款书状态（UNE 侧）
        description: fstate——UNE 侧票状态（代码字典 BillStateConsts）：1正常未缴 2作废
          3已缴款未到账 4已到账 5已缴款；池内已排除 2，池内构成以 1 正常未缴与
          3 已缴款未到账为主（state=3 但 FNE 无记录属状态未回写/单边数据，按生产左连
          判定仍算未缴）；"未缴完整口径"=本字段='1'（单边数据在完整口径下不计）
        sql: "{CUBE}.`fstate`"
        type: string
      - name: item_code
        title: 项目编码
        sql: "{CUBE}.`fitemcode`"
        type: string
      - name: item_name
        title: 项目名称
        description: fitemname 原值——一码多名时以 item_code 分组
        sql: "{CUBE}.`fitemname`"
        type: string
      - name: payer_name
        title: 缴款人名称
        description: fpayername——催缴清单用（可分组/排名/展示缴款人名称，账号类字段不建维度）
        sql: "{CUBE}.`fpayername`"
        type: string
      - name: bus_type
        title: 业务类型
        description: fbustype（直缴/汇缴）
        sql: "{CUBE}.`fbustype`"
        type: string
      - name: acc_agen_code
        title: 归属单位编码
        description: faccagencode——缴款通知书归属单位，行级过滤键（语义待 ETL/业务复核）
        sql: "{CUBE}.`faccagencode`"
        type: string
      - name: rgn_code
        title: 归属区划编码
        description: faccrgncode——缴款通知书区划，行级过滤键；值域与收入区划同体系
          （530000/530100），列语义待 ETL/业务复核
        sql: "{CUBE}.`faccrgncode`"
        type: string

    # 行级权限三条款骨架（group/conditions/row_level），白名单制：
    # 未命中任何策略=整表拒绝 1=0。faccrgncode/faccagencode 语义未实证，命中过滤后
    # 行数偏少属预期（fbelongrgncode 空串占比高故未选它）
    access_policy:
      - group: "*"
        conditions:
          - if: "{ securityContext.region_code }"
        row_level:
          filters:
            - member: rgn_code
              operator: equals
              values: [ "{ securityContext.region_code }" ]
      - group: "*"
        conditions:
          - if: "{ securityContext.agency_code }"
        row_level:
          filters:
            - member: acc_agen_code
              operator: equals
              values: [ "{ securityContext.agency_code }" ]
      - group: "*"
        conditions:
          - if: "{ not securityContext.region_code }"
          - if: "{ not securityContext.agency_code }"
        row_level:
          allow_all: true
