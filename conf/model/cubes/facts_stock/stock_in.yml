# 入库（领票入库）—— P4（docs/cube-dataqa-topic/01-design.md §5）
# 表名勘误（P4 核实）：设计写的 fbe_stock_in 在 Oracle 不存在，实际为 UBE_STOCK_IN
# （413 行）。
# P4 核实结论（db.js 直查）：
#   FID 100% 唯一（413=413）；FDATE 2021-05-10~2026-09-20；
#   FRGNCODE/FAGENIDCODE 无空值；
#   **无状态字段**（18 列无 FCHANGESTATE，入库单无状态口径）。
# 敏感字段：无（编制人 FAUTHOR 不建维度）。
cubes:
  - name: stock_in
    title: 领票入库
    description: |
      领票入库主表（UBE_STOCK_IN，单表 413 行）。每行 = 一张入库单。
      明细（票种/票号段/金额）走 stock_in_item（FPID 关联本表 FID）。
    meta:
      ai_context: >-
        入库单数用 in_count（count）。本表无状态字段（入库单无状态口径）。
        金额与票号段在 stock_in_item（明细）；单票下钻用 bill_no + in_date
        组合（票号跨日期不唯一）。

    sql_table: UBE_STOCK_IN

    joins:
      - name: agency
        sql: "{CUBE}.\"FAGENIDCODE\" = {agency}.\"FAGENIDCODE\""
        relationship: many_to_one
      # 反向 join：供 drill_members 原生下钻（P4 沿用 cbill/cbill_item 模式）
      - name: stock_in_item
        sql: "{CUBE}.\"FID\" = {stock_in_item}.\"FPID\""
        relationship: one_to_many

    measures:
      - name: count
        title: 入库记录数
        type: count
      - name: in_count
        title: 入库单数
        description: count_distinct(FID)（FID 100% 唯一已验证，等价 count）
        sql: "{CUBE}.\"FID\""
        type: countDistinct
        drill_members: [stock_in.bill_no, stock_in.in_date,
                        stock_in_item.bill_code, stock_in_item.bill_no1, stock_in_item.bill_no2]

    dimensions:
      - name: fid
        title: 入库单ID
        sql: "{CUBE}.\"FID\""
        type: string
        primary_key: true
        public: false    # 技术主键不对外
      - name: bill_no
        title: 入库单号
        description: FNO（跨日期不唯一，"单票"要 bill_no + in_date 组合）
        sql: "{CUBE}.\"FNO\""
        type: string
      - name: in_date
        title: 入库日期
        description: FDATE（VARCHAR2 'YYYY-MM-DD'）转日期，时间分析默认维度
        sql: "TO_DATE({CUBE}.\"FDATE\", 'YYYY-MM-DD')"
        type: time
      - name: region_code
        title: 区划编码
        description: FRGNCODE 关联 region.code
        sql: "{CUBE}.\"FRGNCODE\""
        type: string
      - name: agency_code
        title: 单位识别码
        description: FAGENIDCODE 关联 agency.agency_code
        sql: "{CUBE}.\"FAGENIDCODE\""
        type: string

# 行级权限：access_policy 双互补策略（与 paybook/cbill 同款）。
    access_policy:
      - group: "*"
        conditions:
          - if: "{ securityContext.region_code }"
        row_level:
          filters:
            - member: region_code
              operator: equals
              values: ["{ securityContext.region_code }"]
      - group: "*"
        conditions:
          - if: "{ not securityContext.region_code }"
        row_level:
          allow_all: true
