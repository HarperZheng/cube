# 未缴缴款书视图
# 消费方（BI/前端/REST）统一从 view 查；cube 层只留原料。
views:
  - name: fiscal_paybook_unpaid_view
    title: 未缴缴款书
    description: 已开具但缴款人一直未缴款的缴款通知书池（une_paybook_high 反连宽表，已排作废）；
      未缴时长分档、未缴笔数、催缴清单
    meta:
      ai_context: >-
        「术语对照」：未缴缴款书=本池；票面金额=unpaid_paybook_amt（ftotalamt 口径）；
        仍有效未作废/已过期未缴=eff_state 三档（有效=feffdate≥当前日、已过期=否、未知=空；
        完整口径叠加 state='1'）；未缴笔数=unpaid_paybook_count；未缴时长分档=unpaid_bucket
        （当前日−issue_date）——勿回财政收款宽表拼凑（未缴书不在宽表）。
        未缴缴款书池视图："已开具但未缴款"的判定口径=UNE 侧缴款通知书按
        fpaycode 反连缴款宽表无记录（生产左连判定 UPayBook.xml:1428-1431），池内已排作废
        （fstate='2'）。未缴笔数用 unpaid_paybook_count；未缴时长分档用 unpaid_bucket
        （当前日−issue_date，时长序列 <1天/1–10天/10–100天/≥100天）。
        时间锚是 issue_date（开具日期，une 侧 fdate）——勿用缴款宽表的 pay_date（缴款日期，
        未缴书没有缴款动作）或 fill_date（FNE 侧列，未缴书在 FNE 侧无记录）；une 无 ffilldate
        列，按开具日时长分档即本池口径。
        勿在 fiscal_collection_view 用 state='1' 判未缴（宽表主表为 FNE 缴款书，缴款后生成，
        state='1' 仅 1 行不代表未缴池）。池以存量历史票为主（绝大多数在 ≥100天 档）。
        缴款书状态 state 是 UNE 侧票状态（1正常未缴/3已缴款未到账等，作废已排除）；"未缴
        完整口径"=state='1'（单边数据不计，与本池默认口径的差异在答案中声明）。
    cubes:
      - join_path: fiscal_paybook_unpaid
        includes:
          - unpaid_paybook_count
          - unpaid_paybook_amt
          - pay_code
          - issue_date
          - eff_date
          - eff_state
          - unpaid_bucket
          - state
          - item_code
          - item_name
          - payer_name
          - bus_type
          - acc_agen_code
          - rgn_code
