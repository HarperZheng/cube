# 收入流水视图—— round-03 q23（26-资金模块建模开发方案 §八 惯例）
# 消费方（BI/前端/REST）统一从 view 查；cube 层只留原料。
views:
  - name: fiscal_income_daybook_view
    title: 收入流水
    description: 收入流水（fne_income_daybook）；已收未汇缴滞留池（fisgenerec=0）、
      滞留时长分档
    meta:
      ai_context: >-
        收入流水视图（round-03 q23）："执收单位已收上来但还没有汇缴上缴的资金"（已收未汇缴）
        用 stay_amt（sum(fimamt) 限 fisgenerec=0，存量池，实测 740 行/147.2 万元），滞留时长
        分档用 stay_bucket（当前日−received_date，拍板4 时长序列）。时间锚是 received_date
        （资金到账日期）；存量池口径，题面无"今年"时勿按 received_date 过滤当年。
        "是否生成缴库记录"判定用 fisgenerec=0（数值型），勿用 fbatchno 空否替代（round-02
        混装过滤已废除）。income_amt 是不限池的流水对照基准。fownimamt（本级收入，按
        fiodirection 加权）与 fimamt 的口径差待人定，勿擅自互换。与缴款宽表的"到账金额
        entered_amt"（fisreceived 口径）是两个数据源两套口径，勿互混。
    cubes:
      - join_path: fiscal_income_daybook
        includes:
          - stay_amt
          - income_amt
          - pay_code
          - received_date
          - stay_bucket
          - fisgenerec
          - batch_no
          - bus_type
          - sub_code
          - sub_name
          - funds_nature_code
          - funds_nature_name
          - chg_agen_code
          - chg_agen_name
          - rgn_code
