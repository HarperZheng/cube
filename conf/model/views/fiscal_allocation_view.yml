# 清分流向交付视图—— 非税收入全景 P8
views:
  - name: fiscal_allocation_view
    title: 划入划出/跨区划流向
    description: 清分流向事实（fdt，唯一带 from→to 的粒度）；划入划出、收入来源、专户国库
    meta:
      ai_context: >-
        「术语对照」：分入金额=im_amt；资金去向（国库/专户）=bgt_style；跨区划分入=rec_rgn_code=
        本区划且 income_type='9跨区划'，按 chg_rgn_code 分组；收入记账到本单位=rec_agency_code
        过滤（名称列缺口，仅识别码可过滤）；执收单位=chg_agency_*；勿用 trans_amt/funtranamt
        顶替分入金额，勿用资金性质 rec_funds_nature_code 判去向。
        资金流向视图，一行一笔清分，from→to 由区划/单位成对字段表达：划出方看 chg_rgn_code/chg_agency_code，
        划入方看 rec_rgn_code/rec_agency_code，方向不可混用（"划入划出"按方向过滤，勿用同一字段）。
        金额：分入金额用 im_amt，划拨金额用 trans_amt；分组必须用 *_code，*_name 为别名拼接展示、不作准。
        收入类型（正常/跨区划）用 income_type（区划比对 v1，上/下级分入待层级 ETL）；
        归属级次（中央/省/市/县）用 bgt_level（收入区划→字典110 真链），
        四级占比=各级 im_amt÷总额，分母用不带维度单独全量查询；"完成清分"过滤
        （fispayenter）CK 未落地暂不可用，按完成清分口径查为全量属已知限制待 ETL 补列；
        是否分成/分解来源用 calc_source（1不分成 2分成 3提留 4余额），分成比例无数据列。
        划转信息按轮分列：首轮划拨凭证号/是否划转在 trans_no/is_transfer，二次划转轮在 _last 系
        （ftransno_last/fistransfer_last/enter_date/trans_date）；划转到账侧源端未同步，
        按划转到账过滤或分组为空属预期，待 ETL 补数；
        待划拨金额用 pending_trans_amt（ftransamt 合计 WHERE fistransfer!='1'，别名"未划拨金额"，
        时间轴 clear_date）；在途滞留（已下达划拨指令、资金尚未划转到账）的分档
        查询在财政收入视图 fiscal_collection_view：transiting_amt（金额）/transiting_bill_count
        （笔数，fistransfer='1' 且 fisenter='0' 池）+ transit_bucket 时长分档（锚 trans_date 划转
        回执日；池为存量口径，日期实测近全空，按"今年下达"过滤会清空在途池属数据现实勿加）；
        本视图无时长分档成员、trans_order_date 近全空，勿在本视图拼分档；与"未划拨金额"
        （pending_trans_amt，互补池）勿混。
        是否汇总用 collect_flag（fcollectid 非空衍生）。
        划拨到账日期在 enter_date（二次划转到账）；treasury 视图同名 enter_date 是入库口径、
        collection 视图同名是报文侧首次到账——三视图同名三种节点勿混用；
        缴款书侧资金到账在 collection 视图 received_date。
        资金归口用 bgt_style（1国库 2专户）+ rec_acct_type 互校。时间过滤用 pay_date（fdate）。
        划出方区划名称（chg_rgn_name）与划入方单位名称暂无数据列，只出编码。
        同比差值/增长率成员（count_yoy_diff/count_yoy_rate/im_amt_yoy_diff/im_amt_yoy_rate/trans_amt_yoy_diff/trans_amt_yoy_rate）：
        与上年同期（同比）的差值或增长率，引擎已算，直接绑定，答案层勿重复计算；同比用 _yoy 系（平移量固定 1 年，粒度随问句——
        按年/季/月分组分别为年/季/月度同比）；增长率=差值÷上年同期×100，上年同期为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0；
        _ly 伴生列为内部实现，勿直接查询；
        同环比仅 pay_date 一条轴，trans_date/enter_date（_last 二次划转轮）不参与同环比；
        同环比查询单条只用一条时间轴。
    cubes:
      - join_path: fiscal_allocation
        includes:
          - count
          - count_yoy_diff
          - count_yoy_rate
          - im_amt
          - im_amt_yoy_diff
          - im_amt_yoy_rate
          - trans_amt
          - trans_amt_yoy_diff
          - trans_amt_yoy_rate
          - pending_trans_amt
          - trans_bill_count
          - pay_code
          - pay_date
          - clear_date
          - trans_order_date
          - trans_date
          - enter_date
          - chg_agency_code
          - chg_agency_name
          - chg_rgn_code
          - rec_rgn_code
          - rec_rgn_name
          - bgt_level
          - item_code
          - item_name
          - rec_sub_code
          - rec_sub_name
          - rec_agency_code
          - rec_funds_nature_code
          - rec_funds_nature_name
          - rec_bank_code
          - rec_bank_name
          - rec_acct_type
          - bgt_style
          - calc_source
          - is_transfer
          - is_enter
          - trans_stats
          - reconcile_status
          - collect_flag
          - trans_no
          - income_type
        excludes:
          - fid
          - paybook_sub_id
          - data_tag
    folders:
      - name: transfer_in
        includes:
          - rec_rgn_code
          - rec_rgn_name
          - rec_sub_code
          - rec_sub_name
          - rec_agency_code
          - rec_funds_nature_code
          - rec_funds_nature_name
      - name: transfer_out
        includes:
          - chg_agency_code
          - chg_agency_name
          - chg_rgn_code
