# 审验收入明细—— P4.5（writeoff 主子表的收入侧）
# 明细表一行 = 审验单下的单个收费项目（FPID 关联 FBE_WRITEOFF.FID）。
# P4.5 核实（grain）：明细 2044 行 / distinct FPID 296（281 命中主表，95%）；
#   孤儿 284 行集中在 15 个"保险业务监管费"FPID（各 19 行，数据毛刺），
#   belongs_to LEFT JOIN 下钻时 join 主表属性为 null，不影响主表口径。
#   FITEMIDCODE→FAB_ITEM.FITEMIDCODE 100% 匹配（维度侧组合键 P1 规则，
#   本表同时有 FITEMCODE 可组合）。
# 金额四列：FAMT 实收 / FMSTPAYAMT 应缴 / FHASPAYAMT 已缴 / FUNPAYAMT 未缴。
# 成员名短名避 11g 30 字符上限（writeoff_income__payable_amt=27 等）。
cubes:
  - name: writeoff_income
    title: 审验收入明细
    description: |
      票据审验的收入明细（FBE_WRITEOFF_INCOME，2044 行）。
      每行 = 一张审验单下的单个收费项目。审验单属性经 join writeoff 获取。
    meta:
      ai_context: >-
        明细粒度为"审验单×收费项目"（FPID 关联 FBE_WRITEOFF.FID）。
        实收金额用 item_amt，应缴/已缴/未缴用 payable_amt/paid_amt/
        unpaid_amt。审验单属性（单号/状态/区划）经 join writeoff 获取。

    sql_table: FBE_WRITEOFF_INCOME

    joins:
      # belongs_to 主表（P4.5 沿用 cbill_item 同款模式）
      - name: writeoff
        sql: "{CUBE}.\"FPID\" = {writeoff}.\"FID\""
        relationship: many_to_one

    measures:
      - name: count
        title: 明细行数
        type: count
      - name: item_amt
        title: 实收金额(元)
        description: sum(FAMT)（明细粒度实收）
        sql: "{CUBE}.\"FAMT\""
        type: sum
      - name: payable_amt
        title: 应缴金额(元)
        description: sum(FMSTPAYAMT)
        sql: "{CUBE}.\"FMSTPAYAMT\""
        type: sum
      - name: paid_amt
        title: 已缴金额(元)
        description: sum(FHASPAYAMT)
        sql: "{CUBE}.\"FHASPAYAMT\""
        type: sum
      - name: unpaid_amt
        title: 未缴金额(元)
        description: sum(FUNPAYAMT)
        sql: "{CUBE}.\"FUNPAYAMT\""
        type: sum

    dimensions:
      - name: fid
        title: 明细ID
        sql: "{CUBE}.\"FID\""
        type: string
        primary_key: true
        public: false    # 技术主键不对外
      - name: item_id
        title: 项目识别码
        description: FITEMIDCODE 关联 item 维度（FITEMIDCODE 有复用需组合键）
        sql: "{CUBE}.\"FITEMIDCODE\""
        type: string
      - name: item_code
        title: 项目编码
        description: FITEMCODE（与 FITEMIDCODE 组成组合键，P1 规则）
        sql: "{CUBE}.\"FITEMCODE\""
        type: string
      - name: item_name
        title: 项目名称
        description: FITEMNAME（源表冗余列）
        sql: "{CUBE}.\"FITEMNAME\""
        type: string
