# 缴库入库事实（fne_treasury_transfer_new）—— 非税收入全景 P10 建模
# docs/cube-dataqa-topic/26-资金模块建模开发方案.md §七
# 粒度：主 sql 按 fid 去重，一行一笔"缴库单×科目"明细；扇出源 ftranscollectid 不进维度（开放项 #7）
# 口径：三环节 status='9'（回执）/enter_status='1'（已入国库）/reconcile_status='1'（对账）；
#       "已入国库 N 笔"= count + enter_status='1'，时间轴用 enter_date；缴库量/日报按 build_date；
#       ftotalamt=整单金额复印禁 sum（fan trap 实测）；fchgagencode 全空→无单位维度（②条款空结果属预期）
# ⚠️ CK 23.3.15 惯例：每层仅 1 个 join、显式 ON；去重 any() 确定性依据=除 ftranscollectid 外同 fid 全恒定（2026-10-12 逐列验证）
cubes:
  - name: fiscal_treasury
    title: 缴库入库
    description: |
      缴库入库事实 fne_treasury_transfer_new，明细粒度缴库单×科目（按 fid 去重）。
      缴库回执/入国库/对账三环节状态；已入国库笔数与金额、按科目/区划汇总。
      消费方统一从 fiscal_treasury_view 查；cube 层只留原料。
    public: true

    sql: |
      SELECT * FROM (
        SELECT fid,
               any(fpid) AS fpid, any(ftransno) AS ftransno,
               any(fsubcode) AS fsubcode, any(fsubname) AS fsubname,
               any(fsublevel) AS fsublevel, any(fsublevelname) AS fsublevelname,
               any(fstatus) AS fstatus, any(fenterstatus) AS fenterstatus,
               any(freconcilestatus) AS freconcilestatus, any(fsharerate) AS fsharerate,
               any(fchgrgncode) AS fchgrgncode, any(frecrgncode) AS frecrgncode,
               any(fchgagencode) AS fchgagencode,
               any(fpayacctname) AS fpayacctname, any(frecacctname) AS frecacctname,
               any(fdate) AS fdate, any(fenterdate) AS fenterdate,
               any(freconciledate) AS freconciledate,
               any(famt) AS famt, any(ftotalamt) AS ftotalamt
        FROM fne_treasury_transfer_new
        GROUP BY fid
      ) t
      LEFT JOIN (SELECT fsubcode,
                        arrayStringConcat(arraySort(groupUniqArray(fsubname)), ' / ') AS sub_name_canon
                 FROM fne_treasury_transfer_new WHERE fsubcode != '' GROUP BY fsubcode) s
      ON t.fsubcode = s.fsubcode

    measures:
      - name: count
        title: 缴库明细笔数
        description: 去重后一行一笔缴库明细（缴库单×科目）——"已入国库多少笔"的主口径
        drill_members: [build_date, trans_no, sub_code, sub_name, enter_status]
        type: count
      - name: bill_count
        title: 缴库单数
        description: ftransno 去重计数——一张缴库单多科目行时 count 会计多，单数用它
        drill_members: [build_date, trans_no, enter_status]
        sql: "{CUBE}.`ftransno`"
        type: countDistinct
      - name: amt
        title: 缴库金额(元)
        description: famt 合计——缴库明细口径（去重后 sum 正确；不去重会虚高）
        drill_members: [build_date, trans_no, sub_code]
        sql: "{CUBE}.`famt`"
        type: sum
      - name: total_amt
        title: 缴库单票面金额(元)
        description: 整单金额复印在每明细行（fan trap 实测：同单各科目行 ftotalamt 同值=各行 famt 之和）——仅供明细下钻，禁 sum，max=该组最大票面金额
        sql: "{CUBE}.`ftotalamt`"
        type: max

      # ── 同比三件套（28 号方案批 1）：与上年同期比；时间轴随查询（build_date=缴库口径，enter_date=已入国库口径）──
      # multiStage 现算不进预聚合（同 bill_count 惯例）；amt_ly/count_ly 为内部伴生（差值/增长率的编译依赖，
      # timeShift 是成员级属性、sql 无内联平移语法，勿单删），不进 view includes
      - name: amt_ly
        multiStage: true
        sql: '{amt}'
        type: sum
        timeShift:
          - interval: 1 year
            type: prior
            time_dimension: build_date
          - interval: 1 year
            type: prior
            time_dimension: enter_date
      - name: amt_yoy_diff
        title: 缴库金额同比差值(元)
        description: 缴库金额同比差（与上年同期）——引擎已算，粒度随问句（年/季/月分组分别为年/季/月度同比）
        multiStage: true
        sql: '{amt} - {amt_ly}'
        type: number
      - name: amt_yoy_rate
        title: 缴库金额同比增长率(%)
        description: 缴库金额同比增长率=(本期−上年同期)÷上年同期×100——引擎已算；上年同期为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({amt} - {amt_ly}) / NULLIF({amt_ly}, 0)'
        type: number
      - name: count_ly
        multiStage: true
        sql: '{count}'
        type: number
        description: 内部伴生——count 平移 1 年（build_date/enter_date 双轴同 amt_ly），勿进 view includes
        timeShift:
          - interval: 1 year
            type: prior
            time_dimension: build_date
          - interval: 1 year
            type: prior
            time_dimension: enter_date
      - name: count_yoy_diff
        title: 缴库明细笔数同比差值
        description: 缴库明细笔数同比差（与上年同期）——引擎已算，粒度随问句（年/季/月分组分别为年/季/月度同比）
        multiStage: true
        sql: '{count} - {count_ly}'
        type: number
      - name: count_yoy_rate
        title: 缴库明细笔数同比增长率(%)
        description: 缴库明细笔数同比增长率=(本期−上年同期)÷上年同期×100——引擎已算；上年同期为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({count} - {count_ly}) / NULLIF({count_ly}, 0)'
        type: number

      # ── 环比族（28 号方案批 4）：月环比钉上月（粒度 month）、季环比钉上季（粒度 quarter）──
      # 双轴同同比族（build_date=缴库口径，enter_date=已入国库口径）；interval 季必须 3 months 勿写 quarter（注意点 10）；
      # multiStage 现算不进预聚合；_lm/_lq 伴生为编译依赖（勿单删），不进 view includes
      - name: amt_lm
        title: 缴库金额(元)·上月
        description: 内部伴生——amt 平移 1 月（build_date/enter_date 双轴），amt_mom_diff/amt_mom_rate 的编译依赖，勿进 view includes
        sql: '{amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 1 month
            type: prior
            time_dimension: build_date
          - interval: 1 month
            type: prior
            time_dimension: enter_date
      - name: amt_mom_diff
        title: 缴库金额月环比差值(元)
        description: 缴库金额月环比差（与上月）——引擎已算，粒度必须 month
        multiStage: true
        sql: '{amt} - {amt_lm}'
        type: number
      - name: amt_mom_rate
        title: 缴库金额月环比增长率(%)
        description: 缴库金额月环比增长率=(本期−上月)÷上月×100——引擎已算；上月为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({amt} - {amt_lm}) / NULLIF({amt_lm}, 0)'
        type: number
      - name: amt_lq
        title: 缴库金额(元)·上季
        description: 内部伴生——amt 平移 1 季（build_date/enter_date 双轴），amt_qoq_diff/amt_qoq_rate 的编译依赖，勿进 view includes
        sql: '{amt}'
        type: sum
        multiStage: true
        timeShift:
          - interval: 3 months
            type: prior
            time_dimension: build_date
          - interval: 3 months
            type: prior
            time_dimension: enter_date
      - name: amt_qoq_diff
        title: 缴库金额季环比差值(元)
        description: 缴库金额季环比差（与上季）——引擎已算，粒度必须 quarter
        multiStage: true
        sql: '{amt} - {amt_lq}'
        type: number
      - name: amt_qoq_rate
        title: 缴库金额季环比增长率(%)
        description: 缴库金额季环比增长率=(本期−上季)÷上季×100——引擎已算；上季为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({amt} - {amt_lq}) / NULLIF({amt_lq}, 0)'
        type: number
      - name: count_lm
        title: 缴库明细笔数·上月
        description: 内部伴生——count 平移 1 月（build_date/enter_date 双轴），count_mom_diff/count_mom_rate 的编译依赖，勿进 view includes
        sql: '{count}'
        type: number
        multiStage: true
        timeShift:
          - interval: 1 month
            type: prior
            time_dimension: build_date
          - interval: 1 month
            type: prior
            time_dimension: enter_date
      - name: count_mom_diff
        title: 缴库明细笔数月环比差值
        description: 缴库明细笔数月环比差（与上月）——引擎已算，粒度必须 month
        multiStage: true
        sql: '{count} - {count_lm}'
        type: number
      - name: count_mom_rate
        title: 缴库明细笔数月环比增长率(%)
        description: 缴库明细笔数月环比增长率=(本期−上月)÷上月×100——引擎已算；上月为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({count} - {count_lm}) / NULLIF({count_lm}, 0)'
        type: number
      - name: count_lq
        title: 缴库明细笔数·上季
        description: 内部伴生——count 平移 1 季（build_date/enter_date 双轴），count_qoq_diff/count_qoq_rate 的编译依赖，勿进 view includes
        sql: '{count}'
        type: number
        multiStage: true
        timeShift:
          - interval: 3 months
            type: prior
            time_dimension: build_date
          - interval: 3 months
            type: prior
            time_dimension: enter_date
      - name: count_qoq_diff
        title: 缴库明细笔数季环比差值
        description: 缴库明细笔数季环比差（与上季）——引擎已算，粒度必须 quarter
        multiStage: true
        sql: '{count} - {count_lq}'
        type: number
      - name: count_qoq_rate
        title: 缴库明细笔数季环比增长率(%)
        description: 缴库明细笔数季环比增长率=(本期−上季)÷上季×100——引擎已算；上季为 0 或无数据时为 null，报"无法计算/该期无数据"勿按 0
        multiStage: true
        sql: '100.0 * ({count} - {count_lq}) / NULLIF({count_lq}, 0)'
        type: number

    dimensions:
      # ── 码名对（初步设计 §4.2）：本表仅科目有名称列；一码多名实测 ──
      - name: sub_code
        title: 预算科目（缴库）
        description: fsubcode——缴库单科目=清分归属口径（与 collection 视图 rec_sub_* 同源），勿与缴款票面 sub_* 混用
        sql: "{CUBE}.`fsubcode`"
        type: string
      - name: sub_name
        title: 预算科目名称（缴库）
        description: 归一化拼接（一码多名），仅展示不作准
        sql: sub_name_canon
        type: string

      # ── 普通维度（枚举写全，约定 #5）──
      - name: trans_no
        title: 缴库编号
        description: ftransno——缴库单业务单号（70 张）
        sql: "{CUBE}.`ftransno`"
        type: string
      - name: status
        title: 缴库回执状态
        description: fstatus——9缴库回执成功 0未成功（源校验口径 IN('2','9')）
        sql: "{CUBE}.`fstatus`"
        type: string
      - name: enter_status
        title: 入库状态
        description: fenterstatus——1已入国库 0未入库（"已入国库"判定口径，源系统 ETL 校验作业硬口径）
        sql: "{CUBE}.`fenterstatus`"
        type: string
      - name: reconcile_status
        title: 缴库对账状态
        description: freconcilestatus——缴库对账状态（xls#218）：0未对账 1对账成功 2对账失败；
          与 allocation 视图同名成员不同节点（allocation 为到账对账状态，xls#140），勿跨视图混用
        sql: "{CUBE}.`freconcilestatus`"
        type: string
      - name: sub_level
        title: 非税级次编码
        description: fsublevel——0共享级 2省级（fsublevelname 印证）；初步设计 Blocked 项，2026-10-12 实测已同步解锁
        sql: "{CUBE}.`fsublevel`"
        type: string
      - name: sub_level_name
        title: 非税级次名称
        description: fsublevelname 原值——共享级/省级不归一
        sql: "{CUBE}.`fsublevelname`"
        type: string
      - name: share_rate
        title: 分成比例串
        description: fsharerate——35 位定长比例序列（7 位一段），如 0630000/0370000=63/37 分成；原样展示勿人工解读，衍生解析二期（开放项 #8）
        sql: "{CUBE}.`fsharerate`"
        type: string
      - name: chg_rgn_code
        title: 执收区划编码
        description: fchgrgncode——缴库单资金来源侧区划；无名称列（同 fdt）；行级过滤 OR 侧之一
        sql: "{CUBE}.`fchgrgncode`"
        type: string
      - name: rec_rgn_code
        title: 收入区划编码
        description: frecrgncode——收入归属区划；无名称列；行级过滤维度（JWT region_code 注入，§3.1）
        sql: "{CUBE}.`frecrgncode`"
        type: string
      - name: pay_acct_name
        title: 付款账户名称
        description: fpayacctname——缴库付款方账户名（6 值）；账号类列（fpayacct/fpayacctidcode）敏感不建
        sql: "{CUBE}.`fpayacctname`"
        type: string
      - name: rec_acct_name
        title: 收款账户名称
        description: frecacctname——收款方账户名（3 值）；账号类列（frecacct/frecacctidcode）敏感不建
        sql: "{CUBE}.`frecacctname`"
        type: string

      # ── 无名称实体（§4.3：只 code，不造名字）──
      - name: chg_agency_code
        title: 执收单位编码
        description: fchgagencode——源列全空；仅为②条款 access_policy 编译保留（不进 view），
          单位用户查询空结果属预期，ETL 补列后自动生效（开放项 #9）
        sql: "{CUBE}.`fchgagencode`"
        type: string

      # ── 时间维度（全 String → toDateOrNull）──
      # 不建（2026-10-23 29 号文档核对 + CK 实测拍板）：fsenddate（缴库发送日期）/ftransdate（扣款日期）
      # 填充恰=fenterstatus='1' 全集，与 enter_date 同子集不新增信息；
      # fmsgdate≡fdate（同 fpaydate 不建惯例）；fentrustdate/fpayentrustdate/
      # foperatetime 全空（同 fchgagencode 惯例，ETL 补数后自动生效再议）；ftranstime 基本无值
      - name: build_date
        title: 缴库单生成日期（建单日）
        description: fdate（源 FBUILDDATE，缴库单生成日期，xls#150）——主时间轴，日报/趋势按它；
          权威口径"缴库日期"判给 fsendate（缴库发送，未建，与已入库子集重合）；
          fpaydate 与之全等不建；与缴款日期（pay_date）是两个口径
        sql: "toDateOrNull({CUBE}.`fdate`)"
        type: time
      - name: enter_date
        title: 入国库日期
        description: fenterdate——入库日期（xls#203，源缴库报文表，配 fenterstatus 入库状态
          0未入库 1已入库），仅入库成功行有值；"已入国库 N 笔/金额"的时间轴必须用它，勿用 build_date。
          allocation/collection 视图同名 enter_date 是划拨到账口径，不同节点勿混用
        sql: "toDateOrNull({CUBE}.`fenterdate`)"
        type: time
      - name: reconcile_date
        title: 对账日期（缴库）
        description: freconciledate——缴库对账日期（xls#217，源缴库报文表），仅对账成功行有值；
          与 enter_date 完全同日勿当独立时间轴；collection 视图同名是缴款书对账口径
        sql: "toDateOrNull({CUBE}.`freconciledate`)"
        type: time

      # ── 技术键（可建但 public: false，§4.3）──
      - name: fid
        title: 缴库明细ID
        description: 去重键——主 sql GROUP BY 它；同 fid 的 ftranscollectid 多值行已合并
        sql: "{CUBE}.`fid`"
        type: string
        public: false
      - name: fpid
        title: 缴库单ID
        sql: "{CUBE}.`fpid`"
        type: string
        public: false

    # 行级权限：三条款骨架与五要素语义见 26-资金模块建模开发方案 §3.2，JWT 占位符与 claims 约定见 §3.1，
    # 白名单制硬语义见 §3.2（未命中任何策略=整表拒绝 1=0）。
    # treasury 差异点：① 财政用户双区划 OR（照 allocation 现款，§3.2 AND/OR #2 已验证）——缴库单双侧区划均有值，
    #   rec_rgn_code 有 530100 下级行，equals 单边会丢行——OR 恰好兜住；
    # ② 单位用户条款照挂但源列 fchgagencode 全空——命中即空结果（属预期），
    #   ETL 补列后自动生效；③ rec 双无 allow_all。ftm 无缴款人字段，不需要 member_masking。
    access_policy:
      # ① 财政用户：双区划 OR——资金来源侧或归属侧含本区划均可见（allocation ① 同款）
      - group: "*"
        conditions:
          - if: "{ securityContext.region_code }"
        row_level:
          filters:
            - or:
                - member: chg_rgn_code
                  operator: equals
                  values: [ "{ securityContext.region_code }" ]
                - member: rec_rgn_code
                  operator: equals
                  values: [ "{ securityContext.region_code }" ]
      # ② 单位用户：照挂——fchgagencode 全空，命中=空结果（ETL 补列后自动生效，ai_context 已写明）
      - group: "*"
        conditions:
          - if: "{ securityContext.agency_code }"
        row_level:
          filters:
            - member: chg_agency_code
              operator: equals
              values: [ "{ securityContext.agency_code }" ]
      # ③ 平台/管理用户：region、agency 均无 → 全量放行（两条 conditions AND）
      - group: "*"
        conditions:
          - if: "{ not securityContext.region_code }"
          - if: "{ not securityContext.agency_code }"
        row_level:
          allow_all: true

    pre_aggregations:
      - name: main
        measures:
          - fiscal_treasury.count
          - fiscal_treasury.amt
        dimensions:
          - fiscal_treasury.status
          - fiscal_treasury.enter_status
          - fiscal_treasury.reconcile_status
        timeDimension: fiscal_treasury.build_date
        granularity: month
        # CK 23.3.15 强制：预聚合必须带 indexes（MergeTree ORDER BY 即主键），
        # 缺失报 UserError "doesn't support pre-aggregations without indexes"
        # bill_count（countDistinct）不进预聚合，现算
        indexes:
          - name: main_idx
            columns:
              - fiscal_treasury.status
              - fiscal_treasury.enter_status
              - fiscal_treasury.reconcile_status
              - fiscal_treasury.build_date.month
